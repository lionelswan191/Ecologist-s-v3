<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecologist’s Pokédex</title>
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#1d2a22;--mute:#6b776f;--line:#d9d6ca;--red:#c8372d;--green:#2f7d4f;--chip:#e8e5d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1e2721;--ink:#e9efe9;--mute:#93a399;--line:#33403a;--red:#e0483d;--green:#4fae77;--chip:#27322b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1e2721;--ink:#e9efe9;--mute:#93a399;--line:#33403a;--red:#e0483d;--green:#4fae77;--chip:#27322b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{background:var(--red);color:#fff;padding:12px 14px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;align-items:center;gap:10px}
.lens{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fe0ff,#1d7bd1 60%,#0b3e75);border:3px solid #fff;flex:none}
h1{font-size:1.1rem;margin:0;flex:1;letter-spacing:.02em}
.count{font-size:.8rem;opacity:.9}
.regions{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.chip{border:0;background:rgba(255,255,255,.18);color:#fff;padding:7px 14px;border-radius:999px;font-size:.85rem;white-space:nowrap;cursor:pointer}
.chip.on{background:#fff;color:var(--red);font-weight:700}
.layout{display:flex;align-items:flex-start;max-width:1000px;margin:0 auto}
nav{width:118px;flex:none;padding:12px 8px;position:sticky;top:150px;max-height:calc(100vh - 156px);overflow-y:auto}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;font-size:.88rem;cursor:pointer}
nav button.on{background:var(--green);color:#fff;font-weight:600}
nav .sub{padding-left:20px;font-size:.82rem;color:var(--mute)}
nav .sub.on{color:#fff}
nav .grp{font-weight:700;margin-top:4px}
main{flex:1;padding:12px 10px 90px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}nav{width:170px}}
.tile{cursor:pointer;background:none;border:0;padding:0;text-align:center;color:inherit;font:inherit}
.pic{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--chip);border:2px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.62);color:#fff;font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:8px}
.nm{margin-top:6px;font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 10px;line-height:1.5}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-size:1rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;z-index:6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 12px;font-size:1.1rem}
label{display:block;font-size:.8rem;color:var(--mute);margin:10px 0 4px}
input[type=text],select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600;font-size:.95rem;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.p{background:var(--green);color:#fff}.btn.d{background:none;color:var(--red)}
.preview{margin-top:10px;border-radius:12px;max-height:240px;width:100%;object-fit:cover;display:none}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.big{width:100%;border-radius:12px;display:block;margin-bottom:10px}
.meta{color:var(--mute);font-size:.88rem;line-height:1.5}
.latin{font-style:italic}
input[type=date]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.srch{display:block;width:100%;margin:0 0 10px;padding:9px 16px;border-radius:999px;border:0;background:#fff;color:#1d2a22;font:inherit;font-size:.9rem}
.warn{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sm{padding:6px 12px;font-size:.82rem}
.locrow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
a{color:var(--green)}
#hava{width:66px;height:44px;border-radius:12px;background:var(--chip);border:2px solid #fff;overflow:hidden;cursor:pointer;flex:none}
#hava svg,#cprev svg{display:block;width:100%;height:auto}
.sw{display:flex;flex-wrap:wrap;gap:6px}.sw i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:block}.sw i.on{outline:3px solid var(--ink)}
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.sq .pic{border-radius:4px}.grid.ci .pic{border-radius:50%}
</style>
</head>
<body>
<header>
  <div class="top"><div id="hava"></div><h1 id="ttl">Ecologist’s Pokédex</h1><div class="count" id="count"></div><button class="chip" id="cubtn">🎨</button><button class="chip" id="frbtn">👥</button><button class="chip" id="bkbtn">💾</button></div>
  <div class="regions" id="regions"></div>
  <input type="search" id="q" class="srch" placeholder="Search species, place, notes…">
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main><div id="bk"></div><div class="grid" id="grid"></div></main>
</div>
<button class="fab" id="add">＋ New sighting</button>

<div class="modal" id="addM"><div class="sheet">
  <h2 id="addT">New sighting</h2>
  <div class="row">
    <button class="btn p" id="cam">📷 Take photo</button>
    <button class="btn" id="gal">🖼 Choose photo</button>
  </div>
  <input type="file" id="fcam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fgal" accept="image/*" hidden>
  <img class="preview" id="prev" alt="">
  <label for="name">Common name</label><input type="text" id="name" placeholder="e.g. Red squirrel">
  <label for="latin">Latin name (optional)</label><input type="text" id="latin" placeholder="e.g. Sciurus vulgaris">
  <div class="row">
    <div><label for="reg">Region</label><select id="reg"></select></div>
    <div><label for="kind">Group</label><select id="kind"></select></div>
  </div>
  <div class="row"><div><label for="date">Date</label><input type="date" id="date"></div><div><label for="place">Place name (optional)</label><input type="text" id="place" placeholder="e.g. Glendalough"></div></div>
  <div class="locrow"><span id="locst" class="meta"></span><button class="btn sm" id="relo" type="button">📍 Update GPS</button></div>
  <label for="notes">Notes (optional)</label><textarea id="notes" rows="2" placeholder="Habitat, location, date…"></textarea>
  <div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn p" id="save">Add to Pokédex</button></div>
</div></div>

<div class="modal" id="bkM"><div class="sheet">
  <h2>Backup &amp; restore</h2>
  <p class="meta">Your sightings are stored in this browser only. Save a backup file now and then (to Google Drive, iCloud, email it to yourself…) so nothing is lost if browser data is cleared or you change phone.</p>
  <p class="meta" id="bkinfo"></p>
  <button class="btn p" id="exp" style="width:100%">⬇ Save backup file</button>
  <label>Restore from a backup file</label>
  <button class="btn" id="imp" style="width:100%">⬆ Restore from backup…</button>
  <input type="file" id="fimp" accept=".json,application/json" hidden>
  <div class="actions"><button class="btn" id="bkclose">Close</button></div>
</div></div>
<div class="modal" id="cuM"><div class="sheet" id="cu"></div></div>
<div class="modal" id="frM"><div class="sheet" id="fr"></div></div>
<input type="file" id="fc" accept=".json,application/json" hidden>
<div class="modal" id="viewM"><div class="sheet" id="view"></div></div>

<script>
const REGIONS=["Irish","European","African","Asian","American","Oceanian"];
const TAX={Fauna:["Mammals","Birds","Reptiles","Amphibians","Fish","Insects","Other invertebrates"],
Flora:["Trees","Shrubs","Wildflowers","Grasses & sedges","Ferns","Mosses & lichens"],
Fungi:["Mushrooms","Other fungi"]};
let items=[],fRegion="All",fKind="All",fSub=null,pendingImg=null,mem=false,db=null,q="",cur=null,editing=null;

/* storage: IndexedDB, falls back to memory */
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("ecodex",1);
r.onupgradeneeded=()=>r.result.createObjectStore("sp",{keyPath:"id"});
r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>{mem=true;res()}}catch(e){mem=true;res()}})}
function tx(m){return db.transaction("sp",m).objectStore("sp")}
function loadAll(){return new Promise(res=>{if(mem)return res([]);try{const q=tx("readonly").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function put(o){if(!mem)try{tx("readwrite").put(o)}catch(e){}}
function del(id){if(!mem)try{tx("readwrite").delete(id)}catch(e){}}

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderFilters(){
  $("regions").innerHTML=["All",...REGIONS].map(r=>`<button class="chip ${r===fRegion?"on":""}" data-r="${r}">${r==="All"?"All regions":r}</button>`).join("");
  let h=`<button class="grp ${fKind==="All"?"on":""}" data-k="All">All species</button>`;
  for(const k in TAX){
    h+=`<button class="grp ${fKind===k&&!fSub?"on":""}" data-k="${k}">${k} ${fKind===k?"▾":"▸"}</button>`;
    if(fKind===k)h+=TAX[k].map(s=>`<button class="sub ${fSub===s?"on":""}" data-k="${k}" data-s="${esc(s)}">${esc(s)}</button>`).join("");
  }
  $("nav").innerHTML=h;
}
function renderGrid(){
  const list=items.map((it,i)=>({...it,n:i+1})).filter(it=>
    (fRegion==="All"||it.region===fRegion)&&(fKind==="All"||it.kind===fKind)&&(!fSub||it.sub===fSub)&&(!q||[it.name,it.latin,it.notes,it.place,it.sub,it.kind,it.region].join(" ").toLowerCase().includes(q)));
  $("count").textContent=items.length+" logged";
  $("grid").innerHTML=list.length?list.map(it=>`<button class="tile" data-id="${it.id}"><div class="pic"><img src="${it.img}" alt="${esc(it.name)}"><span class="num">${pad(it.n)}</span></div><div class="nm">${esc(it.name)}</div></button>`).join("")
  :`<div class="empty">${items.length?"No species match these filters.":"Your Pokédex is empty.<br>Tap “New sighting” to log your first species."}</div>`;
}
function render(){renderFilters();renderGrid();renderBk()}

$("regions").onclick=e=>{const r=e.target.dataset.r;if(r){fRegion=r;render()}};
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  const k=b.dataset.k,s=b.dataset.s;
  if(s){fSub=fSub===s?null:s;fKind=k}
  else if(k==="All"){fKind="All";fSub=null}
  else{fKind=(fKind===k&&!fSub)?"All":k;fSub=null}
  render()};

/* add form */
$("reg").innerHTML=REGIONS.map(r=>`<option>${r}</option>`).join("");
$("kind").innerHTML=Object.keys(TAX).map(k=>`<optgroup label="${k}">`+TAX[k].map(s=>`<option value="${k}|${esc(s)}">${esc(s)}</option>`).join("")+`</optgroup>`).join("");
function openAdd(){editing=null;$("addT").textContent="New sighting";$("save").textContent="Add to Pokédex";pendingImg=null;cur=null;$("prev").style.display="none";["name","latin","notes","place"].forEach(i=>$(i).value="");$("date").value=today();
  if(fRegion!=="All")$("reg").value=fRegion;$("addM").classList.add("open");getLoc()}
$("add").onclick=openAdd;
$("cancel").onclick=()=>{editing=null;$("addM").classList.remove("open")};
$("cam").onclick=()=>$("fcam").click();$("gal").onclick=()=>$("fgal").click();
function onFile(e){const f=e.target.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    pendingImg=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(url);
    $("prev").src=pendingImg;$("prev").style.display="block"};
  img.src=url;e.target.value=""}
$("fcam").onchange=onFile;$("fgal").onchange=onFile;
$("save").onclick=()=>{
  if(!pendingImg&&!editing){alert("Please add a photo first.");return}
  const name=$("name").value.trim();if(!name){alert("Please enter a name.");return}
  const [kind,sub]=$("kind").value.split("|");
  const o={id:editing?editing.id:Date.now(),mod:Date.now(),name,latin:$("latin").value.trim(),region:$("reg").value,kind,sub,notes:$("notes").value.trim(),img:pendingImg||editing.img,date:$("date").value||today(),place:$("place").value.trim(),lat:cur?cur.lat:null,lng:cur?cur.lng:null,acc:cur?cur.acc:null};
  if(editing){const i=items.findIndex(x=>x.id===editing.id);items[i]=o}else items.push(o);
  put(o);editing=null;$("addM").classList.remove("open");render()};

/* detail */
$("grid").onclick=e=>{const t=e.target.closest(".tile");if(!t)return;
  const i=items.findIndex(x=>x.id==t.dataset.id),it=items[i];
  $("view").innerHTML=`<img class="big" src="${it.img}" alt="${esc(it.name)}"><h2>#${pad(i+1)} ${esc(it.name)}</h2>
  <div class="meta">${it.latin?`<div class="latin">${esc(it.latin)}</div>`:""}<div>${esc(it.region)} · ${esc(it.kind)} · ${esc(it.sub)}</div><div>📅 ${esc(fmtDate(it.date))}</div>${it.place?`<div>📍 ${esc(it.place)}</div>`:""}${it.lat!=null?`<div>🧭 <a href="https://www.openstreetmap.org/?mlat=${it.lat}&mlon=${it.lng}#map=16/${it.lat}/${it.lng}" target="_blank" rel="noopener">${it.lat.toFixed(5)}, ${it.lng.toFixed(5)}</a>${it.acc?` (±${it.acc} m)`:""}</div>`:""}${it.notes?`<p>${esc(it.notes)}</p>`:""}</div>
  <div class="actions"><button class="btn d" id="rm">Delete</button><button class="btn" id="ed">✏ Edit</button><button class="btn p" id="cl">Close</button></div>`;
  $("viewM").classList.add("open");
  $("cl").onclick=()=>$("viewM").classList.remove("open");
  $("ed").onclick=()=>{$("viewM").classList.remove("open");openEdit(it)};
  $("rm").onclick=()=>{if(confirm("Remove this species from your Pokédex?")){items.splice(i,1);del(it.id);$("viewM").classList.remove("open");render()}}};
$("viewM").onclick=e=>{if(e.target.id==="viewM")e.target.classList.remove("open")};

/* edit */
function openEdit(it){editing=it;pendingImg=null;cur=it.lat!=null?{lat:it.lat,lng:it.lng,acc:it.acc}:null;
  $("addT").textContent="Edit sighting";$("save").textContent="Save changes";
  $("prev").src=it.img;$("prev").style.display="block";
  $("name").value=it.name;$("latin").value=it.latin||"";$("notes").value=it.notes||"";$("place").value=it.place||"";
  $("date").value=/^\d{4}-\d\d-\d\d$/.test(it.date||"")?it.date:today();
  $("reg").value=it.region;$("kind").value=it.kind+"|"+it.sub;
  $("locst").textContent=cur?`📍 ${cur.lat.toFixed(5)}, ${cur.lng.toFixed(5)}`+(cur.acc?` (±${cur.acc} m)`:""):"No GPS saved for this sighting.";
  $("addM").classList.add("open")}

/* dates, GPS, search */
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function fmtDate(d){if(!d)return"";return /^\d{4}-\d\d-\d\d$/.test(d)?new Date(d+"T12:00:00").toLocaleDateString("en-IE",{day:"numeric",month:"short",year:"numeric"}):d}
function getLoc(){const s=$("locst");
  if(!navigator.geolocation){s.textContent="GPS not available – type a place name instead.";return}
  s.textContent="Locating…";
  try{navigator.geolocation.getCurrentPosition(p=>{cur={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};s.textContent=`📍 ${cur.lat.toFixed(5)}, ${cur.lng.toFixed(5)} (±${cur.acc} m)`},
  ()=>{s.textContent=cur?"Couldn’t update GPS – kept the saved position.":"No GPS fix – you can still type a place name."},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
  catch(e){s.textContent="No GPS fix – you can still type a place name."}}
$("relo").onclick=getLoc;
$("q").oninput=e=>{q=e.target.value.trim().toLowerCase();renderGrid()};

/* backup & restore */
function lastBk(){try{return +localStorage.getItem("ecodex_bk")||0}catch(e){return 0}}
function setBk(t){try{localStorage.setItem("ecodex_bk",t)}catch(e){}}
function renderBk(){const n=items.filter(i=>(i.mod||i.id)>lastBk()).length;
  $("bk").innerHTML=n>=3?`<div class="warn"><span>⚠ ${n} sightings not backed up yet.</span><button class="btn p sm" id="bknow">Back up now</button></div>`:""}
function bkInfo(){$("bkinfo").textContent=(lastBk()?"Last backup: "+new Date(lastBk()).toLocaleString("en-IE"):"No backup saved yet.")+" · "+items.length+" sightings in the Pokédex"}
$("bk").onclick=e=>{if(e.target.id==="bknow")doExport()};
$("bkbtn").onclick=()=>{bkInfo();$("bkM").classList.add("open")};
$("bkclose").onclick=()=>$("bkM").classList.remove("open");
$("exp").onclick=()=>doExport();
function plainDownload(){try{
  const blob=new Blob([JSON.stringify(snap())],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ecologists-pokedex-backup-${today()}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  setBk(Date.now());renderBk();bkInfo()}
  catch(e){alert("Couldn’t save the backup on this device.")}}
async function doExport(){
  if(!items.length){alert("Nothing to back up yet.");return}
  let dl=null;try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null}catch(e){}
  if(!dl){plainDownload();return}
  try{await dl.save({filename:`ecologists-pokedex-backup-${today()}.json`,data:JSON.stringify(snap())});
    setBk(Date.now());renderBk();bkInfo()}
  catch(e){if(!e||e.code!=="declined")alert("Couldn’t save the backup ("+((e&&e.code)||"error")+").")}}
$("imp").onclick=()=>$("fimp").click();
$("fimp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.items;if(!Array.isArray(arr))throw 0;
    const had=items.length,have=new Set(items.map(i=>i.id));
    const add=arr.filter(o=>o&&o.id&&o.img&&o.name&&!have.has(o.id));
    add.forEach(o=>{items.push(o);put(o)});items.sort((a,b)=>a.id-b.id);
    if(j.profile&&!profile.name){profile=Object.assign(defProfile(),j.profile,{id:"profile"});ensureUid();saveProfile();applyProfile()}
    (Array.isArray(j.friends)?j.friends:[]).forEach(f=>{if(f&&typeof f.uid==="string"&&Array.isArray(f.items)&&!friends.some(x=>x.uid===f.uid)){f.id="f:"+f.uid;friends.push(f);put(f)}});
    if(!had&&add.length)setBk(Date.now());
    render();bkInfo();
    alert(add.length?`Restored ${add.length} sighting${add.length>1?"s":""}.`:"Nothing new to restore – everything in that file is already here.")}
  catch(x){alert("That doesn’t look like a Pokédex backup file.")}};
  r.readAsText(f);e.target.value=""};

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
/* profile, avatar, pet */
const SK=["#ffdbb4","#f1c27d","#c68642","#8d5524","#5c3a21"],HC=["#222","#6b3e1e","#c9a227","#b5391f","#9aa0a6","#3b6fd4"],SH=["#c8372d","#2f7d4f","#3b6fd4","#e0a526","#8e44ad","#222"],PC=["#f4f1ea","#c68642","#e07b39","#555","#e8c547","#7fb069"],BAN=["#c8372d","#2f7d4f","#1d7bd1","#8e44ad","#e0803a","#d4488a","#222b33","#0f7b7b"];
const OPT={hair:["Short","Long","Bun","Bald","Spiky"],face:["Smile","Grin","Glasses","Neutral"],pet:["Dog","Cat","Fox","Owl","Frog","Rabbit"]};
const pk=(L,x)=>L[Math.abs(+x||0)%L.length],P=L=>L.map((t,i)=>[t,i]);
const defProfile=()=>({id:"profile",uid:"",name:"",banner:"#c8372d",accent:"#2f7d4f",theme:"auto",shape:"r",cols:0,av:{skin:1,hair:0,hc:1,face:0,shirt:1},pet:{type:0,color:2,name:""}});
let profile=defProfile(),friends=[];
function saveProfile(){put(profile)}
function ensureUid(){if(!profile.uid){profile.uid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);saveProfile()}}
function snap(){return{app:"ecologists-pokedex",version:2,exported:new Date().toISOString(),items,profile,friends}}
function petSVG(pt){const t=Math.abs(+pt.type||0)%6,b=pk(PC,pt.color),e=t==0?`<ellipse cx="84" cy="46" rx="4" ry="9" fill="${b}" stroke="#0004"/><ellipse cx="106" cy="46" rx="4" ry="9" fill="${b}" stroke="#0004"/>`:t<3?`<path d="M85 40l-2-${t==2?18:13} 9 8zM105 40l2-${t==2?18:13}-9 8z" fill="${b}"/>`:t==3?`<path d="M86 38l-3-9 8 4zM104 38l3-9-8 4z" fill="${b}"/>`:t==4?`<circle cx="88" cy="36" r="5" fill="${b}"/><circle cx="102" cy="36" r="5" fill="${b}"/>`:`<ellipse cx="89" cy="30" rx="3.5" ry="11" fill="${b}"/><ellipse cx="101" cy="30" rx="3.5" ry="11" fill="${b}"/>`,r=t==3?3.5:1.8;
 return (t==0||t==2?`<path d="M108 66q12-2 8-14" stroke="${b}" stroke-width="5" fill="none"/>`:"")+e+`<ellipse cx="95" cy="64" rx="14" ry="10" fill="${b}"/><circle cx="95" cy="48" r="11" fill="${b}"/><circle cx="91" cy="46" r="${r}" fill="#222"/><circle cx="99" cy="46" r="${r}" fill="#222"/><path d="M92 53q3 3 6 0" stroke="#222" fill="none"/>`}
function ava(a,pt,withPet){a=a||{};const h=pk(HC,a.hc),k=pk(SK,a.skin),s="stroke=\"#222\" fill=\"none\"",
 hair=[`<path d="M21 34a19 19 0 0138 0q-19-8-38 0z" fill="${h}"/>`,`<path d="M20 36a20 20 0 0140 0v22h-8V36q-12-8-24 0v22h-8z" fill="${h}"/>`,`<circle cx="40" cy="14" r="8" fill="${h}"/><path d="M21 34a19 19 0 0138 0q-19-8-38 0z" fill="${h}"/>`,"",`<path d="M22 32l4-14 6 10 8-14 8 14 6-10 4 14q-19-8-38 0z" fill="${h}"/>`],
 face=[`<path d="M34 46q6 5 12 0" ${s}/>`,`<path d="M34 45h12q-2 7-6 7t-6-7z" fill="#fff" stroke="#222"/>`,`<circle cx="33" cy="38" r="6" ${s}/><circle cx="47" cy="38" r="6" ${s}/><path d="M39 38h2M34 46q6 5 12 0" ${s}/>`,`<path d="M35 47h10" ${s}/>`];
 return `<svg viewBox="0 0 ${withPet?120:80} 80" xmlns="http://www.w3.org/2000/svg"><path d="M16 80q0-20 24-20t24 20z" fill="${pk(SH,a.shirt)}"/><circle cx="40" cy="38" r="18" fill="${k}"/>${pk(hair,a.hair)}<circle cx="33" cy="38" r="2" fill="#222"/><circle cx="47" cy="38" r="2" fill="#222"/>${pk(face,a.face)}${withPet?petSVG(pt||{}):""}</svg>`}
function applyProfile(){const r=document.documentElement,p=profile;r.style.setProperty("--red",p.banner);r.style.setProperty("--green",p.accent);
 if(p.theme==="auto")r.removeAttribute("data-theme");else r.dataset.theme=p.theme;
 $("ttl").textContent=p.name?`${p.name}’s Pokédex`:"Ecologist’s Pokédex";$("hava").innerHTML=ava(p.av,p.pet,true);
 $("grid").className="grid"+(p.cols?" c"+p.cols:"")+(p.shape&&p.shape!=="r"?" "+p.shape:"")}
function sw(g,k,L,cur,hex){return `<div class="sw">`+L.map((c,i)=>`<i data-g="${g}" data-k="${k}" data-v="${hex?c:i}" class="${(hex?c===cur:i===cur)?"on":""}" style="background:${c}"></i>`).join("")+`</div>`}
function ob(g,k,L,cur){return `<div class="sw">`+L.map(([t,v])=>`<button class="btn sm ${String(v)===String(cur)?"p":""}" data-g="${g}" data-k="${k}" data-v="${v}">${t}</button>`).join("")+`</div>`}
function renderCu(){const p=profile,a=p.av,t=p.pet;
 $("cu").innerHTML=`<h2>Customise</h2><div id="cprev" style="width:210px;margin:0 auto">${ava(a,t,true)}</div>
<label>Trainer name</label><input type="text" data-k="name" value="${esc(p.name)}" maxlength="30">
<label>Pet name</label><input type="text" data-g="pet" data-k="name" value="${esc(t.name||"")}" maxlength="20">
<label>Banner colour</label>${sw("","banner",BAN,p.banner,1)}<label>Accent colour (buttons &amp; filters)</label>${sw("","accent",BAN,p.accent,1)}
<label>Theme</label>${ob("","theme",[["Auto","auto"],["Light","light"],["Dark","dark"]],p.theme)}
<label>Tile shape</label>${ob("","shape",[["Rounded","r"],["Square","sq"],["Circle","ci"]],p.shape)}
<label>Tiles across</label>${ob("","cols",[["Auto",0],["2",2],["3",3],["4",4]],p.cols)}
<label>Skin</label>${sw("av","skin",SK,a.skin)}<label>Hair</label>${ob("av","hair",P(OPT.hair),a.hair)}<div style="height:6px"></div>${sw("av","hc",HC,a.hc)}
<label>Face</label>${ob("av","face",P(OPT.face),a.face)}<label>Shirt</label>${sw("av","shirt",SH,a.shirt)}
<label>Pet</label>${ob("pet","type",P(OPT.pet),t.type)}<div style="height:6px"></div>${sw("pet","color",PC,t.color)}
<div class="actions"><button class="btn p" id="cudone">Done</button></div>`}
$("cubtn").onclick=$("hava").onclick=()=>{renderCu();$("cuM").classList.add("open")};
$("cu").onclick=e=>{const t=e.target.closest("[data-v],#cudone");if(!t)return;if(t.id==="cudone"){$("cuM").classList.remove("open");return}
 const {g,k,v}=t.dataset;(g?profile[g]:profile)[k]=/^\d+$/.test(v)?+v:v;saveProfile();applyProfile();renderCu()};
$("cu").oninput=e=>{const t=e.target,{g,k}=t.dataset;if(!k)return;(g?profile[g]:profile)[k]=t.value;saveProfile();applyProfile();$("cprev").innerHTML=ava(profile.av,profile.pet,true)};
["cuM","frM"].forEach(id=>$(id).onclick=e=>{if(e.target.id===id)e.target.classList.remove("open")});

/* friends & monthly challenge (card files – no server needed) */
async function saveFile(n,t){let dl=null;try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null}catch(e){}
 if(dl){try{await dl.save({filename:n,data:t});return}catch(e){if(e&&e.code==="declined")return}}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const thumb=src=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas"),s=180/Math.max(i.width,i.height);c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.onerror=()=>r("");i.src=src});
function score(its,m){const seen=new Set();let n=0;its.filter(i=>/^\d{4}-\d\d-\d\d$/.test(i.date)).sort((a,b)=>a.date<b.date?-1:1).forEach(i=>{const k=(i.latin||i.name).toLowerCase().trim();if(!seen.has(k)){seen.add(k);if(i.date.slice(0,7)===m)n++}});return n}
function renderFr(v){const m=today().slice(0,7);
 if(v){const f=friends.find(x=>x.uid===v);if(f){$("fr").innerHTML=`<button class="btn sm" id="frback">← Back</button><h2>${esc(f.name)}’s Pokédex</h2><div class="grid c3">`+(f.items.map((it,i)=>`<div class="tile"><div class="pic"><img src="${it.img}" alt=""><span class="num">${pad(i+1)}</span></div><div class="nm">${esc(it.name)}</div></div>`).join("")||"<div class=\"empty\">No species yet.</div>")+`</div>`;return}}
 const rows=[{n:profile.name||"You",a:profile.av,p:profile.pet,s:score(items,m),me:1},...friends.map(f=>({n:f.name,a:f.av,p:f.pet,s:score(f.items,m)}))].sort((a,b)=>b.s-a.s);
 $("fr").innerHTML=`<h2>Friends &amp; challenge</h2><p class="meta">Monthly challenge (${new Date().toLocaleString("en-IE",{month:"long",year:"numeric"})}): 10 points for every species you log for the first time this month. Friends swap small “cards” – import a friend’s latest card to see their Pokédex and refresh the scoreboard.</p>`+rows.map((r,i)=>`<div class="frow"><b>${["🥇","🥈","🥉"][i]||i+1}</b><div style="width:60px">${ava(r.a,r.p,true)}</div><span style="flex:1">${esc(r.n)}${r.me?" (you)":""}</span><b>${r.s*10} pts</b></div>`).join("")+`<div class="row" style="margin:12px 0"><button class="btn p" id="myc">⬆ Share my card</button><button class="btn" id="impc">⬇ Add / update friend</button></div>`+friends.map(f=>`<div class="frow"><span style="flex:1">${esc(f.name)} · ${f.items.length} species</span><button class="btn sm" data-a="view" data-u="${esc(f.uid)}">View</button><button class="btn sm d" data-a="rm" data-u="${esc(f.uid)}">✕</button></div>`).join("")+`<div class="actions"><button class="btn p" id="frclose">Close</button></div>`}
$("frbtn").onclick=()=>{renderFr();$("frM").classList.add("open")};
$("fr").onclick=async e=>{const t=e.target.closest("button");if(!t)return;const u=t.dataset.u,a=t.dataset.a;
 if(t.id==="frclose")$("frM").classList.remove("open");else if(t.id==="frback")renderFr();else if(t.id==="impc")$("fc").click();
 else if(t.id==="myc"){if(!items.length){alert("Log a species first.");return}ensureUid();t.textContent="Preparing…";
  const its=[];for(const i of items)its.push({name:i.name,latin:i.latin,date:i.date,img:await thumb(i.img)});
  await saveFile(`pokedex-card-${(profile.name||"me").replace(/\W+/g,"-")}.json`,JSON.stringify({app:"ecologists-pokedex-card",v:1,uid:profile.uid,name:profile.name||"Ecologist",av:profile.av,pet:profile.pet,items:its}));t.textContent="⬆ Share my card"}
 else if(a==="view")renderFr(u);else if(a==="rm"&&confirm("Remove this friend?")){friends=friends.filter(f=>f.uid!==u);del("f:"+u);renderFr()}};
$("fc").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);
  if(j.app!=="ecologists-pokedex-card"||typeof j.uid!=="string"||!Array.isArray(j.items))throw 0;
  if(j.uid===profile.uid){alert("That’s your own card!");return}
  const fr={id:"f:"+j.uid,uid:j.uid,name:String(j.name||"Friend").slice(0,30),av:j.av||{},pet:j.pet||{},items:j.items.filter(i=>i&&typeof i.img==="string"&&i.img.startsWith("data:image/")).map(i=>({name:String(i.name||"").slice(0,60),latin:String(i.latin||"").slice(0,60),date:String(i.date||"").slice(0,10),img:i.img}))};
  friends=friends.filter(x=>x.uid!==fr.uid);friends.push(fr);put(fr);renderFr()}catch(x){alert("That doesn’t look like a Pokédex friend card.")}};r.readAsText(f);e.target.value=""};

openDB().then(loadAll).then(r=>{items=r.filter(o=>typeof o.id==="number").sort((a,b)=>a.id-b.id);friends=r.filter(o=>typeof o.id==="string"&&o.id.startsWith("f:"));
 profile=Object.assign(defProfile(),r.find(o=>o.id==="profile")||{});ensureUid();applyProfile();render()});
</script>
</body>
